<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venous Track</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-yellow: #ffc107;
            --accent-hover: #e0a800;
            --red-delete: #dc3545;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- SCHERMATA DI INGRESSO (LANDING) --- */
        #landing-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .landing-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        /* Trasparenza assoluta garantita per l'icona 64x64 */
        .logo-icon {
            width: 48px;
            height: 48px;
            background: transparent !important;
            border-radius: 8px;
        }

        .landing-title {
            font-size: 2.5rem;
            margin: 0;
        }

        .landing-buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--accent-hover); }

        #login-form {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            border-radius: 6px;
        }

        /* --- APP PRINCIPALE --- */
        #main-app { display: none; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--bg-card);
            border-bottom: 1px solid #333;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; align-items: center; gap: 20px; }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .live-clock {
            background: #2a2a2a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 10px; height: 10px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* MENU LATERALE */
        #side-menu {
            position: fixed;
            top: 0; left: -250px;
            width: 250px; height: 100%;
            background-color: var(--bg-card);
            border-right: 1px solid #333;
            transition: 0.3s;
            z-index: 500;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #side-menu.open { left: 0; }
        .menu-item {
            background: none; border: none;
            color: white; font-size: 1.1rem;
            padding: 15px 20px; text-align: left;
            cursor: pointer; transition: 0.2s;
        }
        .menu-item:hover { background: #333; }

        /* CARDS SERVER */
        .container { padding: 30px; max-width: 1200px; margin: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .card-icon { width: 48px; height: 48px; border-radius: 8px; background: transparent !important; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin: 0; }
        .card-status { font-size: 0.9rem; color: #28a745; }
        .card-status.offline { color: var(--red-delete); }
        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: var(--red-delete); color: white;
            border: none; padding: 5px 10px; border-radius: 5px;
            cursor: pointer; display: none;
        }
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted);
        }
        .stats-grid strong { color: white; display: block; font-size: 1rem;}
        canvas { max-width: 100%; height: 120px !important; }
    </style>
</head>
<body>

    <!-- SCHERMATA INIZIALE -->
    <div id="landing-screen">
        <div class="landing-header">
            <img src="https://i.imgur.com/2ZQbK1k.png" alt="Icon" class="logo-icon"> <!-- Sostituisci con il link alla tua icona -->
            <h1 class="landing-title">Venous Track</h1>
        </div>
        <div class="landing-buttons" id="landing-buttons">
            <button class="btn" onclick="showLogin()">Login</button>
            <button class="btn" onclick="enterApp('generali')">Default</button>
        </div>
        
        <div id="login-form">
            <input type="text" id="username" placeholder="Nome Utente">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="doLogin()">Entra</button>
            <button class="btn" style="background: #555; color: white;" onclick="hideLogin()">Annulla</button>
            <div id="login-error" style="color: #dc3545; display: none; font-size: 0.9rem;">Credenziali errate!</div>
        </div>
    </div>

    <!-- APP PRINCIPALE -->
    <div id="main-app">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                <div class="header-left" style="gap: 10px;">
                    <img src="https://i.imgur.com/2ZQbK1k.png" alt="Icon" class="logo-icon">
                    <h2 style="margin:0;" id="current-category-title">Tracker Generale</h2>
                </div>
            </div>
            <div class="header-right">
                <div id="add-server-ui" style="display: none; gap: 10px; align-items: center;">
                    <input type="text" id="new-ip" placeholder="IP Server (es. mc.server.it)">
                    <button class="btn" onclick="addServer()">Aggiungi</button>
                </div>
                <div class="live-clock">
                    <div class="live-dot"></div>
                    <span id="clock">--:--:--</span>
                </div>
            </div>
        </header>

        <div id="side-menu">
            <button class="menu-item" onclick="enterApp('generali')">Tracker Generale</button>
            <button class="menu-item" onclick="enterApp('italiani')">Tracker Italiano</button>
            <button class="menu-item" id="menu-logout-btn" style="display: none; color: #dc3545;" onclick="doLogout()">Logout</button>
            <button class="menu-item" id="menu-login-btn" onclick="location.reload()">Torna alla Home</button>
        </div>

        <div class="container">
            <div class="grid" id="servers-grid">
                <!-- Le cards si generano qui -->
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'generali';
        let userPermissions = { add_italiano: false, add_generale: true, delete_server: false };
        let isLoggedIn = false;
        let updateInterval;
        let charts = {};

        // --- GESTIONE OROLOGIO ---
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('it-IT');
        }, 1000);

        // --- GESTIONE UI INIZIALE ---
        function showLogin() {
            document.getElementById('landing-buttons').style.display = 'none';
            document.getElementById('login-form').style.display = 'flex';
            document.getElementById('login-error').style.display = 'none';
        }

        function hideLogin() {
            document.getElementById('landing-buttons').style.display = 'flex';
            document.getElementById('login-form').style.display = 'none';
        }

        async function doLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    userPermissions = data.permissions;
                    isLoggedIn = true;
                    enterApp('italiani'); // Se logga come admin lo porta agli italiani di default
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function doLogout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function enterApp(category) {
            currentCategory = category;
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('side-menu').classList.remove('open');
            
            document.getElementById('current-category-title').innerText = category === 'italiani' ? 'Tracker Italiano' : 'Tracker Generale';
            
            // Gestione visibilità bottoni menu
            if (isLoggedIn) {
                document.getElementById('menu-logout-btn').style.display = 'block';
                document.getElementById('menu-login-btn').style.display = 'none';
            }

            // Gestione visibilità Input Add Server
            const canAdd = (category === 'italiani' && userPermissions.add_italiano) || 
                           (category === 'generali' && userPermissions.add_generale);
            document.getElementById('add-server-ui').style.display = canAdd ? 'flex' : 'none';

            loadData();
            if(updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(loadData, 5000); // 5 secondi
        }

        // --- GESTIONE DATI API ---
        async function loadData() {
            try {
                const res = await fetch(`/api/stats/${currentCategory}`);
                const data = await res.json();
                renderCards(data);
            } catch (e) { console.error("Errore fetch dati:", e); }
        }

        async function addServer() {
            const ip = document.getElementById('new-ip').value;
            if(!ip) return;
            try {
                await fetch(`/api/servers/${currentCategory}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });
                document.getElementById('new-ip').value = '';
                loadData();
            } catch (e) { alert("Errore aggiunta server"); }
        }

        async function deleteServer(ip) {
            if(!confirm(`Sicuro di voler eliminare ${ip}?`)) return;
            try {
                await fetch(`/api/servers/${currentCategory}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });
                loadData();
            } catch (e) { alert("Errore eliminazione server"); }
        }

        // --- RENDERING CARDS E GRAFICI ---
        function renderCards(servers) {
            const grid = document.getElementById('servers-grid');
            
            // Se ci sono server che non sono più in lista, eliminiamo le loro card/chart
            const activeIps = servers.map(s => s.ip);
            Array.from(grid.children).forEach(child => {
                if(!activeIps.includes(child.dataset.ip)) {
                    if(charts[child.dataset.ip]) charts[child.dataset.ip].destroy();
                    child.remove();
                }
            });

            servers.forEach(srv => {
                let card = document.querySelector(`.card[data-ip="${srv.ip}"]`);
                if (!card) {
                    card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.ip = srv.ip;
                    
                    const delBtn = userPermissions.delete_server 
                        ? `<button class="delete-btn" style="display:block;" onclick="deleteServer('${srv.ip}')">X</button>` 
                        : '';

                    card.innerHTML = `
                        ${delBtn}
                        <div class="card-header">
                            <img class="card-icon" id="icon-${srv.ip}" src="">
                            <div>
                                <h3 class="card-title">${srv.ip}</h3>
                                <div class="card-status" id="status-${srv.ip}">Aggiornamento...</div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div>Live Players <strong id="players-${srv.ip}">-</strong></div>
                            <div>Record (Sempre) <strong id="record-${srv.ip}">-</strong></div>
                            <div>Picco 72h <strong id="peak-${srv.ip}">-</strong></div>
                            <div>-1 Giorno <strong id="day1-${srv.ip}">-</strong></div>
                        </div>
                        <canvas id="chart-${srv.ip}"></canvas>
                    `;
                    grid.appendChild(card);
                }

                // Aggiornamento dati DOM
                const iconSrc = srv.favicon || "https://i.imgur.com/2ZQbK1k.png"; // Placeholder trasparente se manca
                document.getElementById(`icon-${srv.ip}`).src = iconSrc;
                
                const statusEl = document.getElementById(`status-${srv.ip}`);
                if (srv.online) {
                    statusEl.innerText = "Online";
                    statusEl.className = "card-status";
                } else {
                    statusEl.innerText = "Offline";
                    statusEl.className = "card-status offline";
                }

                document.getElementById(`players-${srv.ip}`).innerText = `${srv.players} / ${srv.max}`;
                document.getElementById(`record-${srv.ip}`).innerText = srv.record || "-";
                document.getElementById(`peak-${srv.ip}`).innerText = srv.peak_72h || "-";
                document.getElementById(`day1-${srv.ip}`).innerText = srv.day_1 || "-";

                // Gestione Grafico Chart.js - RIMASTO INATTO
                const ctx = document.getElementById(`chart-${srv.ip}`).getContext('2d');
                if (!charts[srv.ip]) {
                    charts[srv.ip] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: srv.chart_labels,
                            datasets: [{
                                label: 'Giocatori',
                                data: srv.chart_data,
                                borderColor: '#ffc107',
                                backgroundColor: 'rgba(255, 193, 7, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { display: false },
                                y: { 
                                    display: true, 
                                    grid: { color: '#333' },
                                    ticks: { color: '#a0a0a0' }
                                }
                            }
                        }
                    });
                } else {
                    charts[srv.ip].data.labels = srv.chart_labels;
                    charts[srv.ip].data.datasets[0].data = srv.chart_data;
                    charts[srv.ip].update();
                }
            });
        }

        // All'avvio, controlliamo la sessione in automatico dal server in background
        fetch('/api/auth')
            .then(res => res.json())
            .then(data => {
                if(data.logged_in) {
                    isLoggedIn = true;
                    userPermissions = data.permissions;
                }
            }).catch(e => console.log("Guest mode"));
            
    </script>
</body>
</html>
