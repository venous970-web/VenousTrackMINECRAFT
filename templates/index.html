<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenousTrack - Minecraft Server Statistics</title>
    <!-- Chart.js per i grafici -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ffc107;
            --accent-hover: #e0a800;
            --border-color: #2a2a2a;
            --danger-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button, .tab-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover, .tab-btn:hover {
            background-color: var(--accent-hover);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .controls-bar {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="password"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            flex-grow: 1;
            max-width: 300px;
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: contain;
            background-color: #2a2a2a;
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-badge.online {
            background-color: rgba(40, 167, 69, 0.2);
            color: var(--success-color);
        }

        .status-badge.offline {
            background-color: rgba(220, 53, 69, 0.2);
            color: var(--danger-color);
        }

        .card-version {
            font-size: 0.85rem;
            color: #888;
            margin-top: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.9rem;
            background-color: #161616;
            padding: 10px;
            border-radius: 6px;
        }

        .chart-container {
            position: relative;
            height: 120px;
            width: 100%;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: #fff;
        }

        .rank-badge {
            font-weight: bold;
            color: #777;
            font-size: 0.9rem;
        }

        /* Modal di Login */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ VenousTrack</div>
        <div class="user-panel" id="user-panel">
            <span id="username-display">Ospite</span>
            <button id="auth-btn" onclick="openLoginModal()">Login</button>
        </div>
    </header>

    <div class="container">
        <!-- Tabs Categorie -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-italiani" onclick="switchCategory('italiani')">Server Italiani</button>
            <button class="tab-btn" id="tab-generali" onclick="switchCategory('generali')">Server Generali</button>
        </div>

        <!-- Barra di controllo aggiunta server -->
        <div class="controls-bar" id="controls-bar" style="display: none;">
            <input type="text" id="server-ip-input" placeholder="Inserisci IP server (es. play.server.it)">
            <button onclick="addServer()">Aggiungi Server</button>
        </div>

        <!-- Griglia dei Server -->
        <div class="servers-grid" id="servers-grid">
            <!-- Popolato via JS -->
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3>Login Amministratore</h3>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="performLogin()">Accedi</button>
            <button style="background-color: #444; color: #fff;" onclick="closeLoginModal()">Annulla</button>
        </div>
    </div>

    <script>
        let currentCategory = 'italiani';
        let userPermissions = { add_italiano: false, add_generale: true, delete_server: false };
        let chartsInstances = {};
        let isLogged = false;

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth');
                const data = await res.json();
                isLogged = data.logged_in;
                userPermissions = data.permissions;
                
                const userDisplay = document.getElementById('username-display');
                const authBtn = document.getElementById('auth-btn');
                const controlsBar = document.getElementById('controls-bar');

                if (isLogged) {
                    userDisplay.innerText = data.username;
                    authBtn.innerText = 'Logout';
                    authBtn.onclick = performLogout;
                } else {
                    userDisplay.innerText = 'Ospite';
                    authBtn.innerText = 'Login';
                    authBtn.onclick = openLoginModal;
                }

                // Mostra/Nascondi barra aggiunta in base ai permessi
                updateControlsVisibility();
            } catch (e) {
                console.error("Errore controllo auth:", e);
            }
        }

        function updateControlsVisibility() {
            const controlsBar = document.getElementById('controls-bar');
            let canAdd = false;
            if (currentCategory === 'italiani' && userPermissions.add_italiano) canAdd = true;
            if (currentCategory === 'generali' && userPermissions.add_generale) canAdd = true;
            
            controlsBar.style.display = canAdd ? 'flex' : 'none';
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('tab-italiani').className = cat === 'italiani' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-generali').className = cat === 'generali' ? 'tab-btn active' : 'tab-btn';
            updateControlsVisibility();
            loadServersStats();
        }

        async function loadServersStats() {
            try {
                const res = await fetch(`/api/stats/${currentCategory}`);
                const servers = await res.json();
                
                // SALVIAMO LA POSIZIONE ATTUALE DELLO SCROLL PRIMA DI RIGENERARE IL DOM
                const currentScroll = window.scrollY;

                const grid = document.getElementById('servers-grid');
                grid.innerHTML = '';

                servers.forEach((srv, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const faviconSrc = srv.favicon || '/static/head.png';
                    const statusBadgeClass = srv.online ? 'status-badge online' : 'status-badge offline';
                    const statusText = srv.online ? 'ONLINE' : 'OFFLINE';
                    const showDelete = userPermissions.delete_server ? 'display: block;' : 'display: none;';

                    card.innerHTML = `
                        <button class="delete-btn" style="${showDelete}" onclick="deleteServer('${srv.ip}')">Elimina</button>
                        <div class="card-header">
                            <span class="rank-badge">#${index + 1}</span>
                            <img src="${faviconSrc}" class="card-icon" alt="Icon">
                            <div>
                                <h3 class="card-title">${srv.ip}</h3>
                                <div style="margin-top: 6px;"><span class="${statusBadgeClass}">${statusText}</span></div>
                                <div class="card-version">${srv.version}</div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div>Players: <strong>${srv.players}</strong></div>
                            <div>Record: <strong>${srv.record}</strong></div>
                            <div>72h peak: <strong>${srv.peak_72h}</strong></div>
                            <div>1 Days ago: <strong>${srv.day_1}</strong></div>
                            <div>2 Days ago: <strong>${srv.day_2}</strong></div>
                            <div>3 Days ago: <strong>${srv.day_3}</strong></div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-${srv.ip.replace(/[^a-zA-Z0-9]/g, '_')}"></canvas>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Render Chart.js
                    const canvasId = `chart-${srv.ip.replace(/[^a-zA-Z0-9]/g, '_')}`;
                    const ctx = document.getElementById(canvasId);
                    if (chartsInstances[canvasId]) chartsInstances[canvasId].destroy();
                    chartsInstances[canvasId] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: srv.chart_labels,
                            datasets: [{
                                data: srv.chart_data,
                                borderColor: '#ffc107',
                                backgroundColor: 'rgba(255, 193, 7, 0.1)',
                                borderWidth: 2, fill: true, tension: 0.3, pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { display: false },
                                y: { display: true, grid: { color: '#2a2a2a' }, ticks: { color: '#a0a0a0', font: { size: 10 }, maxTicksLimit: 4 } }
                            }
                        }
                    });
                });

                // RIPRISTINIAMO ESATTAMENTE DOVE ERA L'UTENTE
                window.scrollTo(0, currentScroll);

            } catch (e) { 
                console.error(e); 
            }
        }

        async function addServer() {
            const input = document.getElementById('server-ip-input');
            const ip = input.value.trim();
            if (!ip) return;

            const res = await fetch(`/api/servers/${currentCategory}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            });
            const data = await res.json();
            if (data.status === 'success') {
                input.value = '';
                loadServersStats();
            } else {
                alert(data.message || 'Errore durante l\'aggiunta');
            }
        }

        async function deleteServer(ip) {
            if (!confirm(`Sei sicuro di voler eliminare ${ip}?`)) return;

            const res = await fetch(`/api/servers/${currentCategory}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            });
            const data = await res.json();
            if (data.status === 'success') {
                loadServersStats();
            } else {
                alert(data.message || 'Errore durante l\'eliminazione');
            }
        }

        function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

        async function performLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.status === 'success') {
                closeLoginModal();
                checkAuth().then(() => loadServersStats());
            } else {
                alert(data.message);
            }
        }

        async function performLogout() {
            await fetch('/api/logout', { method: 'POST' });
            checkAuth().then(() => loadServersStats());
        }

        // Init
        window.onload = async () => {
            await checkAuth();
            loadServersStats();
            // Aggiorna automaticamente ogni 5 secondi senza rimbalzi in alto
            setInterval(loadServersStats, 5000);
        };
    </script>
</body>
</html>
