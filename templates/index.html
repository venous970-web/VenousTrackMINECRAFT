<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venous Track</title>
    <!-- Favicon locale -->
    <link rel="icon" type="image/png" href="/static/head.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-yellow: #ffc107;
            --accent-hover: #e0a800;
            --red-delete: #dc3545;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        #landing-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .landing-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .logo-icon, .card-icon {
            background: transparent !important;
            border-radius: 8px;
            object-fit: contain;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
        }

        .landing-title {
            font-size: 2.5rem;
            margin: 0;
        }

        .landing-buttons {
            display: flex;
            gap: 20px;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 250px;
            text-align: center;
        }

        .btn:hover { background-color: var(--accent-hover); }

        #login-form {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            padding: 10px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            border-radius: 6px;
        }

        #main-app { display: none; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--bg-card);
            border-bottom: 1px solid #333;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; align-items: center; gap: 20px; }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .live-clock {
            background: #2a2a2a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 10px; height: 10px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        #side-menu {
            position: fixed;
            top: 0; left: -250px;
            width: 250px; height: 100%;
            background-color: var(--bg-card);
            border-right: 1px solid #333;
            transition: 0.3s;
            z-index: 500;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #side-menu.open { left: 0; }
        
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }

        .menu-item {
            background: none; border: none;
            color: white; font-size: 1.1rem;
            padding: 15px 20px; text-align: left;
            cursor: pointer; transition: 0.2s;
            width: 100%;
        }
        .menu-item:hover { background: #333; }

        .container { padding: 30px; max-width: 1200px; margin: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .card-icon { width: 48px; height: 48px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin: 0; display: flex; align-items: center; }
        
        .rank-badge { color: var(--text-muted); font-size: 1.2rem; margin-right: 8px; font-weight: bold; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.online {
            background-color: #198754;
            color: #75b798;
            border: 1px solid #28a745;
        }
        .status-badge.offline {
            background-color: #5c1d23;
            color: #ea868f;
            border: 1px solid #dc3545;
        }

        .card-version { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        
        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: var(--red-delete); color: white;
            border: none; padding: 5px 10px; border-radius: 5px;
            cursor: pointer; display: none;
        }
        
        .stats-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px 15px;
            margin-bottom: 20px; 
            font-size: 0.85rem; 
            color: var(--text-muted);
        }
        
        .stats-grid div {
            display: flex;
            flex-direction: column;
        }

        .stats-grid strong { 
            color: var(--accent-yellow); 
            font-size: 1.1rem;
            margin-top: 2px;
            font-weight: bold;
        }
        
        .chart-container {
            position: relative;
            width: 100%;
            height: 130px;
        }

        canvas {
            width: 100% !important;
            height: 130px !important;
        }
    </style>
</head>
<body>

    <!-- Schermata iniziale -->
    <div id="landing-screen">
        <div class="landing-header">
            <img src="/static/head.png" alt="Logo" class="logo-icon">
            <h1 class="landing-title">Venous Track</h1>
        </div>
        <div class="landing-buttons" id="landing-buttons">
            <button class="btn" onclick="enterApp('italiani')">Accedi (Default)</button>
            <button class="btn" onclick="toggleLoginBox()" style="background: transparent; border: 2px solid var(--accent-yellow); color: var(--accent-yellow);">Login Admin</button>
        </div>
        <div id="login-form">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="performLogin()" style="width: 100%;">Conferma Login</button>
        </div>
    </div>

    <!-- App Principale -->
    <div id="main-app">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="/static/head.png" alt="Logo" class="logo-icon" style="width: 36px; height: 36px;">
                    <h2 id="category-title" style="margin:0;">Server Italiani</h2>
                </div>
            </div>
            <div class="header-right">
                <div class="live-clock">
                    <div class="live-dot"></div>
                    <span id="clock">--:--:--</span>
                </div>
                <button class="btn" id="add-server-header-btn" onclick="promptAddServer()" style="display:none; padding: 6px 12px; font-size: 0.9rem; width: auto;">➕ Aggiungi Server</button>
                <button class="btn" id="logout-btn" onclick="performLogout()" style="display:none; padding: 6px 12px; font-size: 0.9rem; background: #333; color: white; border: 1px solid #555; width: auto;">Logout</button>
            </div>
        </header>

        <!-- Menu laterale -->
        <div id="side-menu">
            <div class="menu-header">
                <h3 style="margin:0;">Menu</h3>
                <button class="menu-btn" onclick="toggleMenu()" style="font-size: 1.4rem;">✕</button>
            </div>
            <button class="menu-item" onclick="switchCategory('italiani')">🇮🇹 Server Italiani</button>
            <button class="menu-item" onclick="switchCategory('generali')">🌐 Server Generali</button>
            <button class="menu-item" onclick="goHome()">🏠 Home</button>
        </div>

        <div class="container">
            <div class="grid" id="servers-grid">
                <!-- Le card dei server verranno caricate qui dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'italiani';
        let userPermissions = { add_italiano: false, add_generale: true, delete_server: false };
        let isLoggedIn = false;
        let chartsInstances = {};

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('it-IT');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function toggleLoginBox() {
            const box = document.getElementById('login-form');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function enterApp(category) {
            currentCategory = category;
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('category-title').innerText = category === 'italiani' ? 'Server Italiani' : 'Server Generali';
            checkAuthStatus();
            loadServersStats();
            setInterval(loadServersStats, 5000);
        }

        function switchCategory(category) {
            currentCategory = category;
            document.getElementById('category-title').innerText = category === 'italiani' ? 'Server Italiani' : 'Server Generali';
            toggleMenu();
            checkAuthStatus();
            loadServersStats();
        }

        function goHome() {
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('landing-screen').style.display = 'flex';
            document.getElementById('side-menu').classList.remove('open');
        }

        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/auth');
                const data = await res.json();
                isLoggedIn = data.logged_in;
                userPermissions = data.permissions;
                
                if (isLoggedIn) {
                    document.getElementById('logout-btn').style.display = 'block';
                } else {
                    document.getElementById('logout-btn').style.display = 'none';
                }

                const canAdd = (currentCategory === 'italiani' && userPermissions.add_italiano) || (currentCategory === 'generali' && userPermissions.add_generale);
                if (canAdd) {
                    document.getElementById('add-server-header-btn').style.display = 'block';
                } else {
                    document.getElementById('add-server-header-btn').style.display = 'none';
                }
            } catch (e) {
                console.error("Errore verifica auth", e);
            }
        }

        async function performLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    enterApp('italiani');
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("Errore di connessione durante il login");
            }
        }

        async function performLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                isLoggedIn = false;
                userPermissions = { add_italiano: false, add_generale: true, delete_server: false };
                alert("Logout effettuato");
                goHome();
            } catch (e) {
                console.error("Errore logout", e);
            }
        }

        async function loadServersStats() {
            try {
                const res = await fetch(`/api/stats/${currentCategory}`);
                const servers = await res.json();
                
                const currentScroll = window.scrollY;

                const grid = document.getElementById('servers-grid');
                grid.innerHTML = '';

                servers.forEach((srv, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const faviconSrc = srv.favicon || '/static/head.png';
                    const statusBadgeClass = srv.online ? 'status-badge online' : 'status-badge offline';
                    const statusText = srv.online ? 'ONLINE' : 'OFFLINE';
                    
                    const showDelete = userPermissions.delete_server ? 'display: block;' : 'display: none;';

                    card.innerHTML = `
                        <button class="delete-btn" style="${showDelete}" onclick="deleteServer('${srv.ip}')">Elimina</button>
                        <div class="card-header">
                            <span class="rank-badge">#${index + 1}</span>
                            <img src="${faviconSrc}" class="card-icon" alt="Icon">
                            <div>
                                <h3 class="card-title">${srv.ip}</h3>
                                <div style="margin-top: 6px;"><span class="${statusBadgeClass}">${statusText}</span></div>
                                <div class="card-version">${srv.version}</div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div>Players: <strong>${srv.players}</strong></div>
                            <div>Record: <strong>${srv.record}</strong></div>
                            <div>72h peak: <strong>${srv.peak_72h}</strong></div>
                            <div>1 Days ago: <strong>${srv.day_1}</strong></div>
                            <div>2 Days ago: <strong>${srv.day_2}</strong></div>
                            <div>3 Days ago: <strong>${srv.day_3 || 0}</strong></div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-${srv.ip.replace(/[^a-zA-Z0-9]/g, '_')}"></canvas>
                        </div>
                    `;
                    grid.appendChild(card);

                    renderChart(srv);
                });

                window.scrollTo(0, currentScroll);

            } catch (e) {
                console.error("Errore caricamento statistiche server", e);
            }
        }

        function renderChart(srv) {
            const canvasId = `chart-${srv.ip.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            if (chartsInstances[canvasId]) {
                chartsInstances[canvasId].destroy();
            }

            chartsInstances[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: srv.chart_labels,
                    datasets: [{
                        data: srv.chart_data,
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255, 193, 7, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function(context) {
                                    return `Orario: ${context[0].label}`;
                                },
                                label: function(context) {
                                    return ` Player: ${context.parsed.y}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: { 
                            display: true, 
                            grid: { color: '#2a2a2a' },
                            ticks: { color: '#a0a0a0', font: { size: 10 }, maxTicksLimit: 4 }
                        }
                    }
                }
            });
        }

        async function promptAddServer() {
            const ip = prompt("Inserisci l'indirizzo IP del server Minecraft:");
            if (!ip) return;
            try {
                const res = await fetch(`/api/servers/${currentCategory}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Server aggiunto con successo!");
                    loadServersStats();
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("Errore durante l'aggiunta del server");
            }
        }

        async function deleteServer(ip) {
            if (!confirm(`Sei sicuro di voler eliminare il server ${ip}?`)) return;
            try {
                const res = await fetch(`/api/servers/${currentCategory}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Server eliminato");
                    loadServersStats();
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("Errore durante l'eliminazione");
            }
        }
    </script>
</body>
</html>
