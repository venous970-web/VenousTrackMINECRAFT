<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenousTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #121212; color: #e4e4e7; min-height: 100vh; padding: 12px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 16px auto; flex-wrap: wrap; gap: 12px; }
        .logo-title { font-size: 1.4rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; }
        .logo-title span { color: #facc15; }
        
        .add-box { display: flex; gap: 8px; background: #1e1e1e; padding: 6px; border-radius: 8px; border: 1px solid #2d2d2d; width: 100%; max-width: 360px; }
        .add-box input { background: transparent; border: none; color: #fff; padding: 6px 10px; outline: none; font-size: 0.85rem; flex: 1; width: 100%; }
        .add-box button { background: #facc15; color: #000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .add-box button:hover { background: #eab308; }

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        
        .server-row {
            background-color: #1a1a1a;
            border: 1px solid #262626;
            padding: 12px 14px;
            display: grid;
            grid-template-columns: 44px 1fr 240px;
            gap: 12px;
            align-items: center;
            border-radius: 8px;
        }

        .left-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .server-icon { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: #262626; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #71717a; }
        .rank-num { font-size: 0.8rem; font-weight: 700; color: #a1a1aa; }

        .info-col { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: #a1a1aa; min-width: 0; }
        .server-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
        .star-icon { color: #facc15; font-size: 0.85rem; flex-shrink: 0; }
        .server-name { color: #ffffff; font-weight: 700; font-size: 0.95rem; word-break: break-all; }
        
        .status-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
        .status-online { background: #166534; color: #4ade80; }
        .status-offline { background: #991b1b; color: #fca5a5; }

        .stat-bold { color: #ffffff; font-weight: 700; }
        .version-tag { color: #71717a; margin-top: 1px; font-size: 0.75rem; }

        .chart-col { height: 85px; position: relative; width: 100%; }

        @media (max-width: 650px) {
            .server-row {
                grid-template-columns: 40px 1fr;
                gap: 10px;
                padding: 10px 12px;
            }
            .chart-col {
                grid-column: span 2;
                height: 90px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">Venous<span>Track</span></div>
        <div class="add-box">
            <input type="text" id="newIp" placeholder="IP Server (es. play.coralmc.it)">
            <button onclick="addServer()">Aggiungi</button>
        </div>
    </div>

    <div class="container" id="serverContainer"></div>

    <script>
        const charts = {};
        const chartDataMap = {};

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                renderServers(data);
            } catch (err) {
                console.error("Errore fetch stats:", err);
            }
        }

        function renderServers(servers) {
            const container = document.getElementById('serverContainer');

            servers.forEach((s, index) => {
                let row = document.getElementById('row-' + s.ip);
                const formattedPlayers = new Intl.NumberFormat('it-IT').format(s.players);
                
                const statusBadgeHtml = s.online 
                    ? '<span class="status-badge status-online">ONLINE</span>' 
                    : '<span class="status-badge status-offline">OFFLINE</span>';

                if (!row) {
                    row = document.createElement('div');
                    row.className = 'server-row';
                    row.id = 'row-' + s.ip;

                    row.innerHTML = `
                        <div class="left-col">
                            ${s.favicon ? `<img class="server-icon" id="icon-${s.ip}" src="${s.favicon}" alt="icon">` : `<div class="server-icon" id="icon-${s.ip}">🌐</div>`}
                            <div class="rank-num" id="rank-${s.ip}">#${index + 1}</div>
                        </div>
                        <div class="info-col">
                            <div class="server-title-row">
                                <span class="star-icon">☆</span>
                                <span class="server-name" id="name-${s.ip}">${s.ip}</span>
                                <span id="status-${s.ip}">${statusBadgeHtml}</span>
                            </div>
                            <div>Players: <span class="stat-bold" id="players-${s.ip}">${formattedPlayers}</span></div>
                            <div>72h Peak: <span id="peak-${s.ip}">${s.peak_72h}</span></div>
                            <div>Record: <span id="record-${s.ip}">${s.record}</span></div>
                            <div>1 Day Ago: <span id="d1-${s.ip}">${s.day_1}</span></div>
                            <div>2 Days Ago: <span id="d2-${s.ip}">${s.day_2}</span></div>
                            <div>3 Days Ago: <span id="d3-${s.ip}">${s.day_3}</span></div>
                            <div class="version-tag" id="ver-${s.ip}">${s.version}</div>
                        </div>
                        <div class="chart-col">
                            <canvas id="chart-${s.ip}"></canvas>
                        </div>
                    `;
                    container.appendChild(row);
                    initChart(s.ip, s.chart_labels, s.chart_data);
                } else {
                    document.getElementById('rank-' + s.ip).innerText = '#' + (index + 1);
                    document.getElementById('players-' + s.ip).innerText = formattedPlayers;
                    document.getElementById('peak-' + s.ip).innerText = s.peak_72h;
                    document.getElementById('record-' + s.ip).innerText = s.record;
                    document.getElementById('d1-' + s.ip).innerText = s.day_1;
                    document.getElementById('d2-' + s.ip).innerText = s.day_2;
                    document.getElementById('d3-' + s.ip).innerText = s.day_3;
                    document.getElementById('ver-' + s.ip).innerText = s.version;
                    document.getElementById('status-' + s.ip).innerHTML = statusBadgeHtml;
                    
                    const iconContainer = document.getElementById('icon-' + s.ip);
                    if (s.favicon) {
                        if (iconContainer.tagName === 'IMG') {
                            iconContainer.src = s.favicon;
                        } else {
                            const newImg = document.createElement('img');
                            newImg.className = 'server-icon';
                            newImg.id = 'icon-' + s.ip;
                            newImg.src = s.favicon;
                            iconContainer.replaceWith(newImg);
                        }
                    }
                    updateChart(s.ip, s.chart_labels, s.chart_data);
                }

                container.appendChild(row);
            });
        }

        function initChart(ip, labels, data) {
            const ctx = document.getElementById('chart-' + ip).getContext('2d');
            chartDataMap[ip] = { labels: labels, datasets: [{ label: 'Players', data: data, borderColor: '#facc15', borderWidth: 2, pointRadius: 2, pointHoverRadius: 6, tension: 0.25 }] };

            charts[ip] = new Chart(ctx, {
                type: 'line',
                data: chartDataMap[ip],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return ' Players: ' + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            grid: { color: '#262626' },
                            ticks: { color: '#a1a1aa', font: { size: 10 }, precision: 0 }
                        }
                    }
                }
            });
        }

        function updateChart(ip, labels, data) {
            if (!charts[ip]) return;
            charts[ip].data.labels = labels;
            charts[ip].data.datasets[0].data = data;
            charts[ip].update('none');
        }

        async function addServer() {
            const input = document.getElementById('newIp');
            const ip = input.value.trim();
            if (!ip) return;
            await fetch('/api/servers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip: ip })
            });
            input.value = '';
            fetchStats();
        }

        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
