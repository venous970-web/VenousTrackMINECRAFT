<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venous Track</title>
    <!-- Favicon del browser con la tua icona -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/2ZQbK1k.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-yellow: #ffc107;
            --accent-hover: #e0a800;
            --red-delete: #dc3545;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        #landing-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .landing-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .logo-icon, .card-icon {
            background: transparent !important;
            border-radius: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
        }

        .landing-title {
            font-size: 2.5rem;
            margin: 0;
        }

        .landing-buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--accent-hover); }

        #login-form {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            border-radius: 6px;
        }

        #main-app { display: none; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--bg-card);
            border-bottom: 1px solid #333;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; align-items: center; gap: 20px; }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .live-clock {
            background: #2a2a2a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 10px; height: 10px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        #side-menu {
            position: fixed;
            top: 0; left: -250px;
            width: 250px; height: 100%;
            background-color: var(--bg-card);
            border-right: 1px solid #333;
            transition: 0.3s;
            z-index: 500;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #side-menu.open { left: 0; }
        .menu-item {
            background: none; border: none;
            color: white; font-size: 1.1rem;
            padding: 15px 20px; text-align: left;
            cursor: pointer; transition: 0.2s;
        }
        .menu-item:hover { background: #333; }

        .container { padding: 30px; max-width: 1200px; margin: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .card-icon { width: 48px; height: 48px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin: 0; display: flex; align-items: center; }
        
        .rank-badge { color: var(--text-muted); font-size: 1.2rem; margin-right: 8px; font-weight: bold; }
        
        .card-status { font-size: 0.95rem; color: #28a745; font-weight: 500; }
        .card-status.offline { color: var(--red-delete); }
        .card-version { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        
        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: var(--red-delete); color: white;
            border: none; padding: 5px 10px; border-radius: 5px;
            cursor: pointer; display: none;
        }
        
        .stats-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px;
            margin-bottom: 20px; 
            font-size: 0.85rem; 
            color: var(--text-muted);
        }
        
        .stats-grid strong { 
            color: var(--accent-yellow); 
            display: block; 
            font-size: 1.3rem;
            margin-top: 4px;
            font-weight: bold;
        }
        
        /* Contenitore rigido per adattare perfettamente il grafico alle dimensioni della card senza distorsioni */
        .chart-container {
            position: relative;
            width: 100%;
            height: 130px;
        }

        canvas {
            width: 100% !important;
            height: 130px !important;
        }
    </style>
</head>
